- title: Recovery rates on defaulted auto loans
  tech: SQL · Python · Power BI
  award: Semi-finalist · Crescent Bank Datathon
  text: Merged nine input tables in SQL, engineered features and compared 8–10 models to predict how much of a defaulted balance is recovered after repossession.
  links:
