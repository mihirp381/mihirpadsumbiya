- name: Beau Mahadev
  role: Direct Supervisor · Energybox
  pull: Despite only being with us 4 months, Mihir provided a tremendous amount of value.
  text: I had the pleasure to be Mihir’s direct supervisor during his Energybox summer internship. Despite only being with us 4 months, Mihir provided a tremendous amount of value. He quickly understood his assigned tasks and took ownership to complete them with minimal hand holding. He demonstrated both strong technical skills and great communication skills. In addition to completing all assigned work he also took initiative to solve other problems, such as creating a Python script to automatically extract data from PDFs, saving many hours of company time on data entry. Any Data science team would be lucky to have Mihir.

- name: Ike Nwabah
  role: Professor · University of Texas at Dallas
  pull: Mihir is dynamic, smart, and self-aware.
  text: "I had the opportunity to teach Mihir at UTD in my Professional Development class. Mihir was a model student: always on time, attentive, and very engaged. Mihir stood out from some of his peers in the way he took the course very seriously. He sought ways constantly sharpen himself and his skills. Mihir is dynamic, smart, and self-aware. I have full confidence that he will excel at any organisation he joins."
