<figure class="plate note-fig{% if include.pixelated %} is-pixelated{% endif %}">
  <div class="plate-frame"><img src="{{ include.src | relative_url }}" alt="{{ include.alt | escape }}"{% if include.width %} width="{{ include.width }}"{% endif %}{% if include.height %} height="{{ include.height }}"{% endif %} loading="lazy" decoding="async"></div>
  {%- if include.caption %}
  <figcaption class="fig-cap">{% if include.number %}<span class="fig-num">Figure {{ include.number }}.</span>{% endif %}{{ include.caption }}</figcaption>
  {%- endif %}
</figure>
